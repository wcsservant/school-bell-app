name: Build School Bell EXE (32-bit)

on:
  push:
    branches: [ "32bit-version" ] # 새로 만든 32비트 브랜치에서만 작동하도록 설정

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v4

    - name: Python 3.8 (32비트) 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.8'
        architecture: 'x86' # [핵심] 32비트 파이썬을 설치하여 32비트용 exe를 생성하게 함

    - name: 필수 패키지 설치
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: 포터블 EXE 빌드
      run: |
        pyinstaller --noconfirm --onefile --windowed main.py

    - name: 빌드된 32비트 EXE 파일 업로드
      uses: actions/upload-artifact@v4
      with:
        name: SchoolBell-Win7-32bit # 기존 64비트 파일과 헷갈리지 않게 이름 변경
        path: dist/*.exe