name: Build School Bell EXE (32-bit)

on:
  push:
    branches: [ "32bit-version" ]
  workflow_dispatch: # Actions 탭에 'Run workflow' 수동 실행 버튼을 만들어 줍니다.

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v4

    - name: Python 3.8 (32비트) 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.8'
        architecture: 'x86'

    - name: 필수 패키지 설치
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: 포터블 EXE 빌드
      run: |
        pyinstaller --noconfirm --onefile --windowed main.py

    - name: 빌드된 32비트 EXE 파일 업로드
      uses: actions/upload-artifact@v4
      with:
        name: SchoolBell-Win7-32bit
        path: dist/*.exe